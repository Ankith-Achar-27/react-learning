<!DOCTYPE html>
<html>
<head>
    <title>ChatBot</title>
    <link rel="stylesheet" href="styles/chatbot.css">
</head>
<body>
<div class="js-container"></div>

<script src="https://unpkg.com/supersimpledev/react.js"></script>
<script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
<script src="https://unpkg.com/supersimpledev/Chatbot.js"></script>
<script src="https://unpkg.com/supersimpledev/babel.js"></script>
<script type="text/babel">

    function ChatInput({chatMessages , setChatMessages}) {
        const [inputText, setInputText] = React.useState('');

        function saveInputText(event){
            setInputText(event.target.value);
        }


        async function sendMessage(){
            if (!inputText.trim()) {
                return;
            }

            const newChatMessage = [
                ...chatMessages,
                {
                    message:inputText,
                    sender:'user',
                    id: crypto.randomUUID()
                }
            ];

            setInputText('');

            // Display the user's message and a loading spinner.
            const loadingMessage = {
                message: '',
                sender: 'robot',
                loading: true,
                id: crypto.randomUUID()
            };

            setChatMessages([
                ...newChatMessage,
                loadingMessage
            ]);

            await new Promise(resolve => setTimeout(resolve, 200));
            const response = await Chatbot.getResponse(inputText);

            // Replace the loading spinner with the chatbot's response.
            setChatMessages([
                ...newChatMessage,
                {
                    message: response,
                    sender: 'robot',
                    id: crypto.randomUUID()
                }
            ]);
        }

        return (
            <div className="chat-input-container">

                <input
                    placeholder="Send a message to chatbot"
                    size="30"
                    onChange={saveInputText}
                    onKeyDown={(event) => {
                        if (event.key === 'Enter') {
                            sendMessage();
                        }
                    }}
                    value={inputText}
                    className="chat-input"
                />
                <button onClick={sendMessage} className="send-button">
                    Send
                </button>
            </div>
        );

    };

    function ChatMessage({ message, sender, loading }){
        //const message = props.message;
        //const sender = props.sender;
        //const { message, sender } = props;

      /*  if(sender === 'robot'){
            return (
                <div>
                    <img src="assets/bot.png" width="50" />
                    {message}
                </div>
            );
        }

       */

        return (
            <div className={sender === 'robot' ? 'chat-message-robot' : 'chat-message-user'}>
                { sender === 'robot' && (
                    <img src="assets/bot.png" className="chat-message-profile" />
                )}
                <div className="chat-message-text">
                    {loading ? (
                        <img
                            src="assets/loading-spinner.gif"
                            className="loading-spinner"
                            alt="Loading..."
                        />
                    ) : (
                        message
                    )}
                </div>


                { sender === 'user' && (
                    <img src="assets/user.png" className="chat-message-profile" />
                )}
            </div>
        );
    }

    function ChatMessages({chatMessages}){

        //const [chatMessages,setChatMessages] = array;
        //const chatMessages = array[0];
        //const setChatMessages = array[1];

        const chatMessageRef = React.useRef(null);

        React.useEffect(()=>{
            const containerElem = chatMessageRef.current;
            if (containerElem) {
                containerElem.scrollTop = containerElem.scrollHeight;
            }
        },[chatMessages])

        return (
            <div className="chat-messages-container" ref={chatMessageRef}>
                {chatMessages.map((chatMessage)=>{
                    return (
                        <ChatMessage
                            message = {chatMessage.message}
                            sender = {chatMessage.sender}
                            loading={chatMessage.loading}
                            key={chatMessage.id}
                        />
                    );
                })}
            </div>
        );

    }


    function App(){
        const [chatMessages, setChatMessages] = React.useState([]);

        return (
            <div className="app-container">
                {chatMessages.length === 0 && (
                    <p className="welcome-message">
                        Welcome to the chatbot project! Send a message using the textbox below.
                    </p>
                )}

                <ChatMessages
                chatMessages = {chatMessages}
                />
                <ChatInput
                    chatMessages = {chatMessages}
                    setChatMessages = {setChatMessages}
                />
            </div>
        );
    }

    const container = document.querySelector('.js-container');
    ReactDOM.createRoot(container).render(<App />);
</script>
</body>
</html>
